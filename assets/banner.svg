<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 350" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b132b" />
      <stop offset="50%" stop-color="#1c2541" />
      <stop offset="100%" stop-color="#3a506b" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4cc9f0" />
      <stop offset="50%" stop-color="#4895ef" />
      <stop offset="100%" stop-color="#4361ee" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7209b7" />
      <stop offset="100%" stop-color="#f72585" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 800; font-size: 46px; fill: url(#textGrad); }
    .subtitle { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 500; font-size: 20px; fill: #e0e1dd; opacity: 0.9; }
    .tagline { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 600; font-size: 14px; fill: #4cc9f0; letter-spacing: 2px; text-transform: uppercase; }
    .node-text { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 600; font-size: 11px; fill: #ffffff; }
    
    @keyframes pulseGlow {
      0% { opacity: 0.3; transform: scale(0.98); }
      50% { opacity: 0.7; transform: scale(1.02); }
      100% { opacity: 0.3; transform: scale(0.98); }
    }
    @keyframes floatParticle {
      0% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-12px) rotate(180deg); }
      100% { transform: translateY(0px) rotate(360deg); }
    }
    @keyframes dashOffset {
      0% { stroke-dashoffset: 100; }
      100% { stroke-dashoffset: 0; }
    }
    
    .bg-grid { stroke: rgba(255, 255, 255, 0.05); stroke-width: 1; }
    .flow-line { stroke: #4cc9f0; stroke-width: 2; stroke-dasharray: 6 6; animation: dashOffset 20s linear infinite; }
    .particle { animation: floatParticle 8s ease-in-out infinite; transform-origin: center; }
  </style>

  <!-- Background -->
  <rect width="1200" height="350" fill="url(#bgGrad)" rx="16" />
  
  <!-- Grid Lines -->
  <g class="bg-grid">
    <line x1="0" y1="70" x2="1200" y2="70" />
    <line x1="0" y1="140" x2="1200" y2="140" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="200" y1="0" x2="200" y2="350" />
    <line x1="400" y1="0" x2="400" y2="350" />
    <line x1="600" y1="0" x2="600" y2="350" />
    <line x1="800" y1="0" x2="800" y2="350" />
    <line x1="1000" y1="0" x2="1000" y2="350" />
  </g>

  <!-- Animated Dynamic Background Elements (Kept lower/behind text or to sides) -->
  <g opacity="0.4">
    <!-- Flow Path -->
    <path d="M 50 280 Q 300 320 600 270 T 1150 290" fill="none" class="flow-line" />
    
    <!-- Floating Tech Nodes in Background Right -->
    <g class="particle" style="animation-delay: 0s;">
      <circle cx="1020" cy="100" r="35" fill="rgba(76, 201, 240, 0.15)" stroke="#4cc9f0" stroke-width="1.5" />
      <text x="1020" y="104" text-anchor="middle" class="node-text">21 CFR Part 11</text>
    </g>
    <g class="particle" style="animation-delay: 2s;">
      <circle cx="1110" cy="200" r="40" fill="rgba(247, 37, 133, 0.15)" stroke="#f72585" stroke-width="1.5" />
      <text x="1110" y="204" text-anchor="middle" class="node-text">TMF Ref Model</text>
    </g>
    <g class="particle" style="animation-delay: 4s;">
      <circle cx="940" cy="220" r="30" fill="rgba(114, 9, 183, 0.15)" stroke="#7209b7" stroke-width="1.5" />
      <text x="940" y="224" text-anchor="middle" class="node-text">GCP Audit</text>
    </g>
  </g>

  <!-- Main Content Overlay (Guaranteed Crisp Foreground Visibility) -->
  <g transform="translate(60, 0)">
    <!-- Category Badge -->
    <rect x="0" y="55" width="280" height="28" rx="14" fill="url(#accentGrad)" opacity="0.9" />
    <text x="14" y="74" class="tagline" fill="#ffffff">CLINICAL CONTENT &amp; GXP ECOSYSTEM</text>
    
    <!-- Title -->
    <text x="0" y="145" class="title" filter="url(#glow)">Awesome Clinical Trial eTMF 📋✨</text>
    
    <!-- Subtitle -->
    <text x="0" y="190" class="subtitle">Electronic Trial Master File (eTMF) Platforms &amp; Open-Source Architecture</text>
    <text x="0" y="220" class="subtitle" font-size="16px" opacity="0.75">Curated Directory of Commercial Enterprise SaaS, Regulatory Standards &amp; Developer Tools</text>

    <!-- Stat Pill Tags -->
    <g transform="translate(0, 255)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="160" height="36" rx="8" fill="#1c2541" stroke="#4cc9f0" stroke-width="1.5" />
      <text x="80" y="22" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13px" font-weight="600" fill="#4cc9f0">🏢 10 Enterprise SaaS</text>
      
      <!-- Pill 2 -->
      <rect x="175" y="0" width="175" height="36" rx="8" fill="#1c2541" stroke="#f72585" stroke-width="1.5" />
      <text x="262" y="22" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13px" font-weight="600" fill="#f72585">💻 10 Open-Source Repos</text>

      <!-- Pill 3 -->
      <rect x="365" y="0" width="190" height="36" rx="8" fill="#1c2541" stroke="#7209b7" stroke-width="1.5" />
      <text x="460" y="22" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13px" font-weight="600" fill="#b5179e">⚡ Inspection Readiness</text>
    </g>
  </g>
</svg>
